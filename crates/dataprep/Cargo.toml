[package]
name = "county-dataprep"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
county-core = { path = "../core" }
geo = "0.33.1"
geojson = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
