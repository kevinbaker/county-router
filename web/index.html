<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collin County Route Planner</title>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header>
          <div>
            <h1>Route Planner</h1>
            <p class="sub">Collin County, TX</p>
          </div>
          <button id="start-over" class="start-over" hidden>Start over</button>
        </header>

        <section id="step-input">
          <label for="addresses">Stops</label>
          <p class="hint">CAD property IDs or addresses, one per line. A list of IDs can also be separated by commas or spaces.</p>
          <textarea
            id="addresses"
            rows="8"
            spellcheck="false"
            placeholder="2625294&#10;401 E Virginia St, McKinney, TX 75069&#10;2100 Bloomdale Rd, McKinney, TX 75071"
          ></textarea>
          <button id="example" class="link example">Try example stops: CAD office, McKinney City Hall, courthouse</button>
          <button id="find" class="primary">Find stops</button>
          <p id="input-error" class="error" hidden></p>
        </section>

        <section id="step-review" hidden>
          <div class="section-head">
            <h2>Check stops</h2>
            <span id="review-summary" class="muted"></span>
          </div>
          <p class="hint">Drag any pin to correct it. Green outlines are the CAD parcels. Stops marked “not found” are skipped until you place them.</p>
          <ol id="stop-list" class="stops"></ol>

          <div class="options">
            <label>Start at
              <select id="start"></select>
            </label>
            <fieldset class="finish">
              <legend>Finish</legend>
              <label class="check"><input type="radio" name="finish" value="start" checked /> Return to start</label>
              <label class="check end-at"><input type="radio" name="finish" value="end" /> End at <select id="end"></select></label>
              <label class="check"><input type="radio" name="finish" value="open" /> Shortest route, end anywhere</label>
            </fieldset>
            <label>Minutes per stop
              <input type="number" id="dwell" value="5" min="0" max="240" step="1" />
            </label>
          </div>
          <button id="solve" class="primary">Plan route</button>
          <p id="solve-error" class="error" hidden></p>
        </section>

        <section id="step-result" hidden>
          <div class="section-head">
            <h2>Route</h2>
            <button id="edit" class="link">Edit stops</button>
          </div>
          <div class="totals" id="totals"></div>
          <ol id="route-list" class="route"></ol>
          <div class="exports">
            <button id="print" class="primary">Print route</button>
            <div id="gmaps-links"></div>
            <button id="gpx">Download GPX</button>
          </div>
        </section>
      </aside>
      <main class="map-wrap">
        <div id="map"></div>
        <button id="fit" class="map-fit" hidden>
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Show full route</span>
        </button>
      </main>
    </div>
    <div id="print-sheet"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
